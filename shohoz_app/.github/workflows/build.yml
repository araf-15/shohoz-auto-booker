name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger button in GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shohoz-auto-booker-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Shohoz Auto-Booker v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## Shohoz Auto-Booker
            
            ### এই version-এ যা আছে:
            - Multiple profile support
            - AC/Non-AC filter
            - Auto adjacent seat selection
            - Multiple passenger support
            - Active/Inactive toggle
            
            ### Install করতে:
            1. APK download করুন
            2. Phone-এ Unknown sources allow করুন
            3. Install করুন
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
